<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a4040">
<title>Ágape — sem conexão</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:light;background:#f5ede4;color:#4a4040}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:22px}
main{text-align:center;max-width:440px;background:white;border:1px solid #e7dbd0;padding:32px 22px;border-radius:20px;box-shadow:0 14px 38px #4a404012}
img{display:block;width:84px;height:84px;margin:0 auto 16px;border-radius:20px}
h1{font-size:1.45rem;margin:0 0 10px}p{color:#726363;line-height:1.55}
button{background:#9f553e;border:0;border-radius:12px;padding:14px 24px;color:white;font-weight:700;font-size:1rem;min-height:48px;cursor:pointer}
</style>
</head>
<body><main>
<img src="/icons/icon-192.png" alt="Ícone Ágape">
<h1>Sem conexão com a internet</h1>
<p>O Ágape continua instalado e sua conta não foi desconectada. Conecte-se à internet e tente novamente para carregar o mural e as escalas.</p>
<button type="button" onclick="location.reload()">Tentar novamente</button>
</main></body>
</html>
