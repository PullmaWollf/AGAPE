<path d="M0 407 Q130 368 245 383 Q382 407 504 359 Q645 307 780 363 Q921 419 1036 351 Q1120 319 1200 349 L1200 500 L0 500Z" fill="url(#hill)" opacity=".68"/>
<path d="M0 462 Q176 407 338 445 Q497 471 651 413 Q805 353 926 417 Q1062 480 1200 399 L1200 500 L0 500Z" fill="url(#ground)"/>
<path d="M0 490 Q238 453 388 474 Q575 493 745 458 Q960 412 1200 467 L1200 500 L0 500Z" fill="#43263c" opacity=".7"/>
