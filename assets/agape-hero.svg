<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="Pôr do sol rosado com colinas e uma cruz, simbolizando fé e amor">
<defs>
  <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fff0e7"/><stop offset=".43" stop-color="#f6b9ad"/><stop offset=".75" stop-color="#d67e8d"/><stop offset="1" stop-color="#7e3a57"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#ffeac7" stop-opacity=".96"/><stop offset=".45" stop-color="#ffe3c8" stop-opacity=".65"/><stop offset="1" stop-color="#ffe5c8" stop-opacity="0"/></radialGradient>
  <linearGradient id="hill" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#a65770"/><stop offset="1" stop-color="#512c4d"/></linearGradient>
  <linearGradient id="ground" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#8a425d"/><stop offset="1" stop-color="#3c233b"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="17"/></filter>
</defs>
<rect width="1200" height="500" fill="url(#sky)"/>
<circle cx="905" cy="210" r="270" fill="url(#glow)"/>
<circle cx="920" cy="232" r="78" fill="#ffdfbc" opacity=".65" filter="url(#blur)"/>
<circle cx="922" cy="220" r="61" fill="#ffe6c9" opacity=".72"/>
<g fill="#fff6ef" opacity=".3">
  <circle cx="665" cy="75" r="5"/><circle cx="740" cy="135" r="4"/><circle cx="1050" cy="72" r="7"/><circle cx="1130" cy="175" r="3"/>
</g>
